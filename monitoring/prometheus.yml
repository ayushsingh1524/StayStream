# Prometheus configuration for StayStream monitoring
# Scrapes the FastAPI /metrics endpoint

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "staystream-dashboard"
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:8000"]
        labels:
          service: "staystream"
          component: "dashboard"
