<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayStream · Cities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Header & Navigation -->
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="inline-flex h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
          <h1 class="text-2xl font-bold tracking-tight text-white">StayStream · City Analytics</h1>
        </div>
        <nav class="flex items-center gap-2 mt-3 text-sm">
          <a href="/" class="px-3 py-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-900 transition">Overview</a>
          <a href="/cities" class="px-3 py-1 rounded-md bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 font-medium">Cities</a>
          <a href="/dlq" class="px-3 py-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-900 transition">DLQ Inspector</a>
          <a href="/metrics" target="_blank" class="px-3 py-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-900 transition">/metrics</a>
        </nav>
      </div>
      <div class="flex flex-wrap items-center gap-3 text-xs">
        <div class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800">
          <span class="text-slate-400">Spark Rate:</span>
          <span id="spark-rate" class="font-semibold text-emerald-400 ml-1">0.0 rows/s</span>
        </div>
        <div class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800">
          <span class="text-slate-400">Batch:</span>
          <span id="spark-batch" class="font-semibold text-sky-400 ml-1">0 ms</span>
        </div>
        <div class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800">
          <span class="text-slate-400">Freshness:</span>
          <span id="freshness" class="font-semibold text-slate-200 ml-1">—</span>
        </div>
      </div>
    </header>

    <!-- Bookings vs Cancellations Chart -->
    <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-200 mb-3">Bookings vs Cancellations by City</h2>
      <div class="h-64">
        <canvas id="cityVolumeChart"></canvas>
      </div>
    </section>

    <!-- Full City Leaderboard Table -->
    <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 overflow-x-auto">
      <h2 class="text-sm font-semibold text-slate-200 mb-3">City Leaderboard</h2>
      <table class="w-full text-sm text-left">
        <thead class="text-xs uppercase text-slate-400 border-b border-slate-800">
          <tr>
            <th class="py-2 pr-3">City</th>
            <th class="py-2 pr-3 text-right">Bookings</th>
            <th class="py-2 pr-3 text-right">Cancellations</th>
            <th class="py-2 pr-3 text-right">Cancel Rate</th>
            <th class="py-2 pr-3 text-right">Net Revenue</th>
            <th class="py-2 text-right">Avg Latency</th>
          </tr>
        </thead>
        <tbody id="city-table" class="divide-y divide-slate-800/70"></tbody>
      </table>
    </section>

  </div>

  <script type="module" src="/static/js/cities.js"></script>
</body>
</html>
