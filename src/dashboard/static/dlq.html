<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayStream · DLQ Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body class="min-h-screen antialiased">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Header & Navigation -->
    <header class="glass-panel rounded-2xl px-5 py-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="sonar-dot sonar-dot-amber"></span>
          <h1 class="text-2xl font-bold text-[#F0FAFC]">StayStream · DLQ Inspector</h1>
        </div>
        <nav class="nav-shell inline-flex items-center gap-1.5 mt-3 p-1 rounded-xl text-xs">
          <a href="/" class="nav-pill px-3.5 py-1.5 rounded-lg">Overview</a>
          <a href="/cities" class="nav-pill px-3.5 py-1.5 rounded-lg">Cities</a>
          <a href="/dlq" class="nav-pill nav-pill-active px-3.5 py-1.5 rounded-lg">DLQ Inspector</a>
          <a href="/metrics" target="_blank" class="nav-pill px-3.5 py-1.5 rounded-lg font-mono-num">/metrics ↗</a>
        </nav>
      </div>

      <div class="flex flex-wrap items-center gap-2.5 text-xs">
        <div class="telemetry-chip px-3 py-2 rounded-xl flex items-center gap-2">
          <span class="text-[#8BB8CA]">Spark Rate</span>
          <span id="spark-rate" class="font-mono-num font-semibold text-[#9FE7F5]">0.0 rows/s</span>
        </div>
        <div class="telemetry-chip px-3 py-2 rounded-xl flex items-center gap-2">
          <span class="text-[#8BB8CA]">Batch</span>
          <span id="spark-batch" class="font-mono-num font-semibold text-[#429EBD]">0 ms</span>
        </div>
        <div class="telemetry-chip px-3 py-2 rounded-xl flex items-center gap-2">
          <span class="text-[#8BB8CA]">Freshness</span>
          <span id="freshness" class="font-mono-num font-semibold text-[#F0FAFC]">—</span>
        </div>
      </div>
    </header>

    <!-- Breakdown & Filter -->
    <section class="glass-panel rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div id="dlq-badges" class="flex flex-wrap gap-2 text-xs font-mono-num"></div>
      <div class="flex items-center gap-2.5 text-xs">
        <label for="reason-filter" class="text-[#8BB8CA]">Filter by reason:</label>
        <select id="reason-filter" class="bg-[#021824] border border-[#429EBD]/40 rounded-lg px-3 py-1.5 text-[#F0FAFC] focus:outline-none focus:border-[#9FE7F5]">
          <option value="">All reasons</option>
          <option value="invalid_json">invalid_json</option>
          <option value="missing_required_field">missing_required_field</option>
          <option value="non_positive_price">non_positive_price</option>
          <option value="failed_validation">failed_validation</option>
        </select>
      </div>
    </section>

    <!-- DLQ Table -->
    <section class="glass-panel rounded-2xl p-5 overflow-x-auto">
      <table class="ocean-table w-full text-xs text-left">
        <thead class="uppercase tracking-wider">
          <tr>
            <th class="py-2.5 pr-3">ID</th>
            <th class="py-2.5 pr-3">Reason</th>
            <th class="py-2.5 pr-3">Received At</th>
            <th class="py-2.5">Raw Payload</th>
          </tr>
        </thead>
        <tbody id="dlq-table" class="font-mono-num"></tbody>
      </table>
    </section>

  </div>

  <script type="module" src="/static/js/dlq.js"></script>
</body>
</html>
